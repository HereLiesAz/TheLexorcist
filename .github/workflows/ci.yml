name: CI

# A fast, secret-free gate that runs on every push and pull request.
#
# This exists because commit 3b9838c reached main with a version catalog that
# did not parse -- an unterminated string and three dangling version
# references -- so Gradle failed during configuration, before compiling a line
# of code, and nobody noticed. build.yml is a release pipeline: it needs
# signing secrets, so it cannot gate contributions, and its Gradle step runs
# under `set +e`. Nothing was checking that the project simply builds.
#
# Keep this job free of secrets so it runs on forks. google-services.json is
# synthesised from the checked-in template with placeholder identifiers: the
# Google Services plugin only needs a structurally valid file to run, and no
# network call is made during compilation.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Synthesise a placeholder google-services.json
        run: |
          sed -e 's/{{PROJECT_NUMBER}}/000000000000/' \
              -e 's/{{PROJECT_ID}}/lexorcist-ci/' \
              -e 's/{{APP_ID}}/1:000000000000:android:0000000000000000000000/' \
              -e 's/{{CLIENT_ID}}/000000000000-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.apps.googleusercontent.com/' \
              -e 's/{{GOOGLE_SERVICES_API_KEY}}/AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/' \
              app/google-services.template.json > app/google-services.json

      - name: Validate the version catalog and project layout
        run: ./gradlew projects --no-daemon

      - name: Compile
        run: ./gradlew :shared:assemble :app:compileDebugKotlin --no-daemon

      - name: Test
        run: ./gradlew :shared:allTests :app:testDebugUnitTest --no-daemon

      # Compiling is not enough. Duplicate classes from a badly published
      # dependency, dexing failures (D8 rejects class names containing a space,
      # which Compose Multiplatform can generate from a project name), and R8
      # missing-class errors all pass compilation and only fail when an APK is
      # actually produced. Every one of those was live in this repo while
      # compilation was green.
      - name: Assemble a debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      # R8 on the release variant, without signing -- the keystore is a secret
      # and this job deliberately has none. Catches missing-class errors and
      # bad keep rules.
      - name: Shrink the release build
        run: ./gradlew :app:minifyReleaseWithR8 --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            shared/build/reports/tests/
            shared/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
